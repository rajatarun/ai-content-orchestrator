openapi: 3.0.3

info:
  title: TaskWeave Content Orchestrator API
  version: "1.0.0"
  description: |
    The HTTP surface of the content orchestrator: a public site/newsletter API
    and a protected admin API for the article lifecycle.

    **This supersedes the endpoint table in CLAUDE.md**, which listed four
    routes and described `/admin` as "List / create articles". The handler
    actually serves thirteen paths and sixteen operations, articles live under
    `/admin/articles` rather than `/admin`, and every
    lifecycle transition goes through
    `POST /admin/articles/{id}/actions/{action}` rather than through PATCH.
    `tests/test_openapi_contract.py` compares this file against the route
    literals in `src/*.py`, so it cannot drift the way that table did.

    **Resolving the server.** Do not hardcode the URL, and do not copy the
    table or bucket names either:

        aws cloudformation describe-stacks --stack-name tarun-admin-content \
          --query "Stacks[0].Outputs"

    `scripts/stack_env.py` turns those outputs into environment variables for a
    harness: API base URL, the DynamoDB table **and the two GSI names needed to
    query it**, the articles bucket and prefix, and the Gemini model id the
    stack is actually deployed with.

    **Authentication.** Every `/admin` route requires both an API key
    (`x-api-key`) and a SIWE-issued bearer JWT; the API sets
    `ApiKeyRequired: true` with a Lambda authorizer as the default and only the
    CORS preflights opt out. `/public/*` and `/site/*` opt out explicitly and
    take neither.

servers:
  - url: "{apiBaseUrl}"
    description: Resolved from the ApiBaseUrl stack output
    variables:
      apiBaseUrl:
        default: https://example.execute-api.us-east-1.amazonaws.com/prod
        description: The ApiBaseUrl output of the tarun-admin-content stack

security:
  - ApiKeyAuth: []
    SiweBearer: []

tags:
  - name: admin
    description: Article lifecycle. Requires both an API key and a bearer JWT.
  - name: public
    description: Unauthenticated. Newsletter signup and appointment requests.
  - name: site
    description: Unauthenticated. Published articles, read from S3 rather than DynamoDB.

paths:

  /admin:
    get:
      tags: [admin]
      operationId: adminHealth
      summary: Liveness probe for the admin API
      responses:
        "200":
          description: Reachable and authorised
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, example: true }

  /admin/articles:
    get:
      tags: [admin]
      operationId: listArticles
      summary: List articles in one status
      description: |
        Backed by the `StatusUpdatedIndex` GSI, whose name is published as the
        `ContentTableStatusUpdatedIndex` stack output. `status` is
        case-insensitive but must be one of the known statuses; an unknown one
        is a 400, not an empty list, so a typo cannot read as "nothing here".
      parameters:
        - name: status
          in: query
          description: Defaults to DRAFT
          schema:
            $ref: "#/components/schemas/ArticleStatus"
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Articles, each decorated with the actions legal in its status
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DecoratedArticle" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [admin]
      operationId: createArticle
      summary: Create a draft article
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                sourceInputs: { type: string }
                tags: { type: array, items: { type: string } }
                status: { $ref: "#/components/schemas/ArticleStatus" }
                scheduledAt: { type: string }
      responses:
        "201":
          description: |
            The created article — **undecorated**. Unlike every other article
            response this one carries no `ctas`/`ctaPresentation`, because the
            create path returns the stored item directly. A client that renders
            action buttons from the create response will render none; re-read
            the article to get them.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Article" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/articles/{id}:
    parameters:
      - $ref: "#/components/parameters/ArticleId"
    get:
      tags: [admin]
      operationId: getArticle
      responses:
        "200":
          description: The article
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecoratedArticle" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [admin]
      operationId: updateArticle
      summary: Merge fields into an article
      description: |
        A shallow merge, except `meta`, which is merged one level deep, and
        `meta.version`, which is incremented. Empty strings and nulls are
        dropped before the write, because DynamoDB rejects an empty string in a
        GSI key attribute — so PATCHing a field to `""` removes it rather than
        blanking it.

        Use the actions endpoint for status transitions: PATCHing `status`
        directly skips the side effects (S3 publish, event log) that the
        corresponding action performs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: The updated article
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DecoratedArticle" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/articles/{id}/events:
    parameters:
      - $ref: "#/components/parameters/ArticleId"
    get:
      tags: [admin]
      operationId: listArticleEvents
      summary: Audit trail for one article
      responses:
        "200":
          description: Events, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        pk: { type: string, example: "EVENT#3f2c…" }
                        sk: { type: string, description: "ISO timestamp, doubling as the sort key" }
                        type: { type: string, example: PUBLISHED_TO_S3 }
                        message: { type: string }

  /admin/articles/{id}/actions/{action}:
    parameters:
      - $ref: "#/components/parameters/ArticleId"
      - name: action
        in: path
        required: true
        description: |
          `request-edits`, `reject` and `mark-failed` also accept underscore and
          singular spellings (`request_edits`, `request-edit`, …); everything
          else must match exactly. An unrecognised action is a 404 with
          `{"error": "Unknown action"}`, not a 400.
        schema:
          type: string
          enum: [generate, submit-for-approval, request-edits, approve, mark-published, mark-failed, archive, reject]
    post:
      tags: [admin]
      operationId: articleAction
      summary: Drive an article through its lifecycle
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                revisionNote: { type: string, description: request-edits }
                reason: { type: string, description: reject / mark-failed / archive }
                publishedAt: { type: string, description: mark-published }
                publishedUrl: { type: string, description: mark-published }
      description: |
        DRAFT → AWAITING_APPROVAL → APPROVED → PUBLISHED, with
        REVISION_REQUESTED, FAILED and ARCHIVED as the branches. The legal
        actions for an article's current status are on the article itself as
        `ctas`, so a client does not have to reimplement the state machine.

        Two actions are not simple status writes:

        * `generate` invokes the draft-generation Lambda asynchronously and
          returns **202** immediately. The article is unchanged when you get
          the response; poll it.
        * `approve` writes the article to S3 before returning. If that upload
          fails the response is a 500 — but the status has **already** been set
          to APPROVED, so the article is approved-but-unpublished rather than
          rolled back.
      responses:
        "200":
          description: Applied
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  article: { $ref: "#/components/schemas/DecoratedArticle" }
                  s3:
                    type: object
                    description: approve only
                    properties:
                      bucket: { type: string }
                      key: { type: string }
        "202":
          description: |
            `generate` only — the generation Lambda was invoked asynchronously.
            Body is `{"ok": true}` and carries no article.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          description: |
            `approve` only — the S3 upload failed after the status was written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  details: { type: string }

  /admin/newsletter/actions/generate:
    post:
      tags: [admin]
      operationId: generateNewsletter
      summary: Build the weekly newsletter without sending it
      description: |
        Invokes the newsletter Lambda synchronously and returns its payload
        verbatim, so the response shape is whatever `src/newsletter.py` returns
        rather than something this API defines.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The newsletter Lambda's own response
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "500":
          description: NEWSLETTER_FN_NAME is not configured on the admin Lambda
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }

  /admin/newsletter/actions/send:
    post:
      tags: [admin]
      operationId: sendNewsletter
      summary: Build and send the weekly newsletter via SES
      description: |
        Sends real email to every subscriber. There is no dry-run flag and no
        confirmation step — an automation harness pointed at the production
        stack will mail the live list.
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The newsletter Lambda's own response
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "500":
          description: NEWSLETTER_FN_NAME is not configured on the admin Lambda
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }

  /admin/subscribers:
    get:
      tags: [admin]
      operationId: listSubscribers
      responses:
        "200":
          description: Every subscriber
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Subscriber" }
    post:
      tags: [admin]
      operationId: addSubscriber
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "201":
          description: The stored subscriber
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subscriber" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/subscribers/{email}:
    delete:
      tags: [admin]
      operationId: deleteSubscriber
      description: |
        Idempotent: deleting an address that was never subscribed is a 200.
        The address is URL-decoded from the path, so `@` must be percent-encoded.
      parameters:
        - name: email
          in: path
          required: true
          schema: { type: string, format: email }
      responses:
        "200":
          description: Gone (or never present)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }

  /admin/travel:
    get:
      tags: [admin]
      operationId: getTravelJournal
      summary: The whole travel journal, dates included (admin only)
      description: |
        Every stored trip, oldest first, exactly as validated on upload.
        The public `/site/travel` is the same journal with every date removed.
      responses:
        "200":
          description: Every trip
          content:
            application/json:
              schema:
                type: object
                required: [trips, count]
                properties:
                  trips:
                    type: array
                    items: { $ref: "#/components/schemas/TravelTrip" }
                  count: { type: integer }
    post:
      tags: [admin]
      operationId: saveTravelTrips
      summary: Add trips, or replace ones with the same id
      description: |
        Takes the Ask Photos journal as it comes: `{"years": [{"year", "trips"}]}`,
        `{"year", "trips"}` or `{"trips"}`. Nothing is stored unless the whole
        upload is valid; the error names the field (`years.0.trips.3.startDate`).
        Instagram links that are not post or reel URLs are dropped, not refused.
        When `SiteRebuildHookUrl` is set, the website is asked to rebuild.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [saved, total, rebuild]
                properties:
                  saved: { type: integer, description: Trips in this upload }
                  total: { type: integer, description: Trips stored now }
                  rebuild:
                    type: string
                    description: "`triggered`, `not-configured`, or `failed…` (never fails the save)"
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/travel/{tripId}:
    delete:
      tags: [admin]
      operationId: deleteTravelTrip
      summary: Remove one trip (idempotent)
      parameters:
        - name: tripId
          in: path
          required: true
          schema: { type: string, pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$" }
      responses:
        "200":
          description: Removed, or was not there
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
                  rebuild: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/dining:
    get:
      tags: [admin]
      operationId: getDining
      summary: The café and restaurant list, with what was left out and why (admin only)
      responses:
        "200":
          description: The stored upload, curated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiningAdminView" }
    post:
      tags: [admin]
      operationId: saveDining
      summary: Replace the café and restaurant list
      description: |
        Takes the card-transaction export as it comes: `{"places": [{"name",
        "category", "city", "region", "visits"}]}` or a bare list. Fast food
        (labelled, or a known chain), the home area, delivery apps, card offers, workplace
        cafeterias, generic names and unreadable card codes are left out, and
        two spellings of one place are merged; the response says which and why.
        The website gets the kept list without `visits`, inside `/site/travel`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DiningAdminView"
                  - type: object
                    properties:
                      rebuild: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/dining/reviews:
    post:
      tags: [admin]
      operationId: saveDiningReviews
      summary: Add café and restaurant reviews
      description: |
        Either the reviews as written, `{"text": "..."}`: optional section
        headings, then `Name — 4★` and a paragraph for each; or
        `{"reviews": [{"name", "rating", "review", "section"}]}`. They are
        added to the reviews already saved, and a place reviewed again takes
        the new review; `"replace": true` swaps the whole set instead. A
        section headed as local to DFW makes its reviews home area, except
        one about being away ("the vacation"). A review
        lands on the place it names (by the merge rules, or a shared
        distinctive first word); one naming no place adds a place. Reviews
        never lift a place past the filters: a reviewed fast-food or home-area
        place stays off the public page, and `reviews` in the response says
        which and why.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DiningAdminView"
                  - type: object
                    properties:
                      rebuild: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/dining/notes:
    post:
      tags: [admin]
      operationId: saveDiningNotes
      summary: Replace the café and restaurant notes
      description: |
        A one-line description and a public score per place, with its city.
        Either as listed, `{"text": "..."}`: section headings, then
        `* Name (address) – 4.5/5. What it is.` (only the city and state are
        kept from the address); or `{"notes": [{"name", "city", "region",
        "score", "note"}]}`. A note lands on the place it names (by spelling
        only) or adds one, and fills in a city the card export left blank.
        "DFW area", or a cityless place in a section headed local to DFW, is
        home area. Notes never lift a place past the filters.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/DiningAdminView"
                  - type: object
                    properties:
                      rebuild: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }

  /admin/settings:
    get:
      tags: [admin]
      operationId: getSiteSettings
      summary: Site settings, with who last changed them
      responses:
        "200":
          description: Every field present; null when never set
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/SiteSettings"
                  - type: object
                    properties:
                      updatedBy:
                        type: string
                        nullable: true
                        description: The caller the SIWE authorizer reported on the last save
    patch:
      tags: [admin]
      operationId: updateSiteSettings
      summary: Change site settings (live on the website's next page load)
      description: |
        Merges the given fields into the single settings item. Only the fields
        below are editable; any other key is a 400, so a misspelt field fails
        loudly instead of saving nothing.

        `homeVariant` is checked for shape only. The design names belong to the
        website (`lib/featureFlags.ts` in rajatarun/resume), which falls back
        to its default for a name it does not recognise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                homeVariant:
                  type: string
                  pattern: "^[a-z][a-z0-9-]{0,31}$"
                  example: terracotta
      responses:
        "200":
          description: The settings after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /public/subscribe:
    post:
      tags: [public]
      operationId: subscribe
      summary: Newsletter signup
      description: |
        The `ses` sub-object reports whether the confirmation email went out.
        A failure there is still a **200** with `ses.ok: false`: the address is
        subscribed either way, and the endpoint deliberately does not fail the
        signup because the mail did not send.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Subscribed
          content:
            application/json:
              schema:
                type: object
                required: [ok, email, ses]
                properties:
                  ok: { type: boolean }
                  email: { type: string, format: email }
                  ses:
                    type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean }
                      already:
                        type: boolean
                        description: The address was already subscribed
                      error: { type: string }
        "400": { $ref: "#/components/responses/PublicBadRequest" }
        "405":
          description: Method not allowed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicError" }

  /public/appointment:
    post:
      tags: [public]
      operationId: requestAppointment
      summary: Appointment request
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                message: { type: string }
      responses:
        "200":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "400": { $ref: "#/components/responses/PublicBadRequest" }

  /site/posts:
    get:
      tags: [site]
      operationId: listPosts
      summary: Published article cards
      description: |
        Served from S3, not DynamoDB: it lists `ArticlesPrefix` under
        `ArticlesBucketName` (both stack outputs) and builds a card per object.

        `errors` is the count of objects that could not be turned into a card.
        It is **not** an error response — the endpoint returns 200 with a
        partial list, so a harness that ignores `errors` will silently accept
        fewer posts than exist.
      security: []
      parameters:
        - name: limit
          in: query
          description: Clamped to 1..50
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          description: Comma-separated statuses to include; defaults to APPROVED,PUBLISHED
          schema: { type: string, default: "APPROVED,PUBLISHED" }
        - name: concurrency
          in: query
          description: S3 fetch parallelism, clamped to 1..10
          schema: { type: integer, default: 5 }
      responses:
        "200":
          description: Cards, newest published first
          content:
            application/json:
              schema:
                type: object
                required: [items, count, errors, bucket, prefix]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        title: { type: string }
                        status: { $ref: "#/components/schemas/ArticleStatus" }
                        publishedAt: { type: string }
                        publishedUrl: { type: string }
                  count: { type: integer, description: Size of items after filtering }
                  errors: { type: integer, description: Objects that could not be read or parsed }
                  bucket: { type: string }
                  prefix: { type: string }
        "405":
          description: Method not allowed
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }

  /site/posts/{id}:
    get:
      tags: [site]
      operationId: getPost
      summary: One published article, as stored in S3
      description: |
        Returns the S3 object verbatim — the article JSON written at approve
        time, which is a snapshot and not the current DynamoDB item.
      security: []
      parameters:
        - $ref: "#/components/parameters/ArticleId"
      responses:
        "200":
          description: The stored article JSON
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "400":
          description: Empty id
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }
        "404": { $ref: "#/components/responses/NotFound" }
        "500":
          description: The object exists but could not be read
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  details: { type: string }

  /site/settings:
    get:
      tags: [site]
      operationId: getPublicSiteSettings
      summary: What the website should show, read on every homepage load
      description: |
        Read from ContentTable (`pk=SETTINGS`, `sk=site`), not S3. Every field
        is present and null until it has been set; the website treats null as
        "use the default it was built with".
      security: []
      responses:
        "200":
          description: The public settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteSettings" }
        "500":
          description: The settings item could not be read
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }

  /site/travel:
    get:
      tags: [site]
      operationId: getPublicTravelJournal
      summary: The travel journal with every date removed
      description: |
        What the website's /traveller is built from. No `startDate`/`endDate`,
        no photo timestamps, no trip ids (Ask Photos writes them as dates), no
        years or month names left in the text, and ordered by country and title rather than
        by when. `key` is an opaque, stable handle for each trip. `dining` is
        the curated café and restaurant list, without visit counts.
      security: []
      responses:
        "200":
          description: The public journal; empty until something is uploaded
          content:
            application/json:
              schema:
                type: object
                required: [trips, dining]
                properties:
                  trips:
                    type: array
                    items: { $ref: "#/components/schemas/PublicTravelTrip" }
                  dining:
                    type: array
                    items: { $ref: "#/components/schemas/DiningPlace" }
        "500":
          description: The journal could not be read
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } } }

components:

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API Gateway usage-plan key; 10000 requests/day, 50 rps, burst 100
    SiweBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by the SIWE authorizer (the siwe-infra stack)

  parameters:
    ArticleId:
      name: id
      in: path
      required: true
      description: Article UUID — the `sk` of the DynamoDB item and the S3 object basename
      schema: { type: string }

  responses:
    BadRequest:
      description: Unusable request
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
    NotFound:
      description: No such article
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string, example: Not found }
    PublicBadRequest:
      description: Unusable request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PublicError" }

  schemas:
    DiningPlace:
      type: object
      required: [name, category]
      properties:
        name: { type: string }
        category: { type: string, enum: [cafe, restaurant, other dining] }
        city: { type: string, nullable: true }
        region: { type: string, nullable: true }
        rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
        review: { type: string, nullable: true, description: "Tarun's own review, when he wrote one" }
        note: { type: string, nullable: true, description: A one-line description of the place }
        score: { type: number, nullable: true, description: "A public score out of 5 (not Tarun's rating)" }
    DiningAdminView:
      type: object
      properties:
        uploaded: { type: integer }
        kept:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/DiningPlace"
              - type: object
                properties:
                  visits: { type: integer }
                  alsoListedAs: { type: array, items: { type: string } }
        excluded:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              reason: { type: string }
        reviews:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              rating: { type: integer }
              matched: { type: array, items: { type: string } }
              public: { type: boolean }
              hiddenBecause: { type: array, items: { type: string } }
        notes:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              matched: { type: array, items: { type: string } }
              public: { type: boolean }
              hiddenBecause: { type: array, items: { type: string } }
        updatedAt: { type: string, nullable: true }
    TravelPlace:
      type: object
      properties:
        city: { type: string, nullable: true }
        region: { type: string, nullable: true }
        countryCode: { type: string, nullable: true, pattern: "^[A-Z]{2}$" }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
    TravelTrip:
      type: object
      required: [id]
      properties:
        id: { type: string }
        title: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        tripType: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        highlights: { type: array, items: { type: string } }
        places: { type: array, items: { $ref: "#/components/schemas/TravelPlace" } }
        photos: { type: array, items: { type: object } }
    PublicTravelTrip:
      type: object
      required: [key, places, posts]
      properties:
        key: { type: string }
        title: { type: string, nullable: true }
        tripType: { type: string, nullable: true }
        summary: { type: string, nullable: true }
        highlights: { type: array, items: { type: string } }
        places: { type: array, items: { $ref: "#/components/schemas/TravelPlace" } }
        posts:
          type: array
          items:
            type: object
            properties:
              url: { type: string }
              description: { type: string, nullable: true }
              isCover: { type: boolean }

    ArticleStatus:
      type: string
      enum: [DRAFT, AWAITING_APPROVAL, APPROVED, PUBLISHED, REVISION_REQUESTED, ARCHIVED, FAILED]

    SiteSettings:
      type: object
      required: [homeVariant, updatedAt]
      properties:
        homeVariant:
          type: string
          nullable: true
          description: Homepage design name; null means the website's built-in default
          example: terracotta
        updatedAt:
          type: string
          nullable: true
          description: ISO timestamp of the last change

    PublicError:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, example: false }
        error: { type: string }

    Article:
      type: object
      description: |
        Empty strings and nulls are stripped before the write, so an optional
        field that was never set is **absent**, not null. Only the keys below
        are guaranteed present.
      required: [pk, sk, id, entityType, status, createdAt, updatedAt, tags, generated, meta]
      properties:
        pk: { type: string, enum: ["ARTICLE"] }
        sk: { type: string, description: The article id; pk/sk together are the DynamoDB key }
        id: { type: string }
        entityType: { type: string, enum: ["ARTICLE"] }
        title: { type: string }
        sourceInputs: { type: string }
        tags: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/ArticleStatus" }
        createdAt: { type: string }
        updatedAt: { type: string, description: Sort key of the StatusUpdatedIndex GSI }
        scheduledAt: { type: string }
        publishedAt: { type: string, description: Sort key of the StatusPublishedIndex GSI }
        publishedUrl: { type: string }
        revisionNote: { type: string }
        generated:
          type: object
          description: AI-generated drafts (LinkedIn post, article body, …)
          additionalProperties: true
        meta:
          type: object
          properties:
            version: { type: integer, description: Incremented on every update }
            retryCount: { type: integer }
            lastError: { type: string }

    DecoratedArticle:
      allOf:
        - $ref: "#/components/schemas/Article"
        - type: object
          required: [ctas, ctaPresentation]
          properties:
            ctas:
              type: array
              description: The actions legal in this article's current status
              items: { type: string }
            ctaPresentation:
              type: string
              enum: [inline, dropdown]
              description: dropdown when there are more than two actions

    Subscriber:
      type: object
      properties:
        pk: { type: string, enum: ["SUBSCRIBER"] }
        sk: { type: string, format: email, description: The email address }
        email: { type: string, format: email }
        createdAt: { type: string }
