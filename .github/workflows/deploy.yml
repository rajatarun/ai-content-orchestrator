name: Deploy SAM Application

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGION: ${{ vars.REGION || 'us-east-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || 'tarun-admin-content' }}
  TEAM_STACK_NAME: ${{ vars.TEAM_STACK_NAME || 'tarun-content-team' }}
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::239571291755:role/teamweave-github-actions-sam-deployer
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: SAM build
        run: sam build --template-file template.yaml

      - name: SAM validate
        run: sam validate --template-file .aws-sam/build/template.yaml --lint

      - name: Load shared stack outputs
        run: |
          STACK_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "${TEAM_STACK_NAME}" \
            --region "${REGION}" \
            --query "Stacks[0].Outputs" \
            --output json)

          ARTIFACT_BUCKET=$(echo "${STACK_OUTPUTS}" | python -c "import json,sys; outputs={x['OutputKey']: x['OutputValue'] for x in json.load(sys.stdin)}; print(outputs.get('ArtifactBucket',''))")
          STATUS_FUNCTION_ARN=$(echo "${STACK_OUTPUTS}" | python -c "import json,sys; outputs={x['OutputKey']: x['OutputValue'] for x in json.load(sys.stdin)}; print(outputs.get('StatusFunctionArn',''))")
          HTTP_API_URL=$(echo "${STACK_OUTPUTS}" | python -c "import json,sys; outputs={x['OutputKey']: x['OutputValue'] for x in json.load(sys.stdin)}; print(outputs.get('HttpApiUrl',''))")

          if [ -z "${ARTIFACT_BUCKET}" ] || [ "${ARTIFACT_BUCKET}" = "None" ]; then
            echo "ArtifactBucket output was not found in ${TEAM_STACK_NAME}" >&2
            exit 1
          fi

          if [ -z "${STATUS_FUNCTION_ARN}" ] || [ "${STATUS_FUNCTION_ARN}" = "None" ]; then
            echo "StatusFunctionArn output was not found in ${TEAM_STACK_NAME}" >&2
            exit 1
          fi

          if [ -z "${HTTP_API_URL}" ] || [ "${HTTP_API_URL}" = "None" ]; then
            echo "HttpApiUrl output was not found in ${TEAM_STACK_NAME}" >&2
            exit 1
          fi

          {
            echo "TEAM_ARTIFACT_BUCKET=${ARTIFACT_BUCKET}"
            echo "TEAM_STATUS_FUNCTION_ARN=${STATUS_FUNCTION_ARN}"
            echo "TEAM_HTTP_API_URL=${HTTP_API_URL}"
            echo "SAM_PARAMETER_OVERRIDES=ArtifactBucket=${ARTIFACT_BUCKET} StatusFunctionArn=${STATUS_FUNCTION_ARN} HttpApiUrl=${HTTP_API_URL}"
          } >> "$GITHUB_ENV"

      - name: SAM deploy
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "${STACK_NAME}" \
            --region "${REGION}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --parameter-overrides ${SAM_PARAMETER_OVERRIDES} \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
