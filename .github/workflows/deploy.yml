name: Deploy SAM Application

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGION: ${{ vars.REGION || 'us-east-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || 'tarun-admin-content' }}
  TEAM_STACK_NAME: ${{ vars.TEAM_STACK_NAME || 'tarun-content-team' }}
  SIWE_STACK_NAME: ${{ vars.SIWE_STACK_NAME || 'siwe-infra' }}
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::239571291755:role/teamweave-github-actions-sam-deployer
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The contract tests compare openapi/, src/ and template.yaml against
      # each other. They need no AWS and no deployed stack, so they run before
      # the build: a spec that has drifted from the handlers, or an Output a
      # harness reads that the template no longer publishes, should stop the
      # deploy rather than be discovered by the next automation run.
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt

      - name: Run contract tests
        run: python -m pytest tests/ -q

      - name: SAM build
        run: sam build --template-file template.yaml

      - name: SAM validate
        run: sam validate --template-file .aws-sam/build/template.yaml --lint

      - name: Load shared stack outputs
        run: |
          TEAM_STACK_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "${TEAM_STACK_NAME}" \
            --region "${REGION}" \
            --query "Stacks[0].Outputs" \
            --output json)

          SIWE_STACK_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "${SIWE_STACK_NAME}" \
            --region "${REGION}" \
            --query "Stacks[0].Outputs" \
            --output json)

          ARTIFACT_BUCKET=$(echo "${TEAM_STACK_OUTPUTS}" | python -c "import json,sys; outputs={x['OutputKey']: x['OutputValue'] for x in json.load(sys.stdin)}; print(outputs.get('ArtifactBucket',''))")
          STATUS_FUNCTION_ARN=$(echo "${TEAM_STACK_OUTPUTS}" | python -c "import json,sys; outputs={x['OutputKey']: x['OutputValue'] for x in json.load(sys.stdin)}; print(outputs.get('StatusFunctionArn',''))")
          HTTP_API_URL=$(echo "${TEAM_STACK_OUTPUTS}" | python -c "import json,sys; outputs={x['OutputKey']: x['OutputValue'] for x in json.load(sys.stdin)}; print(outputs.get('HttpApiUrl',''))")
          AUTHORIZER_FUNCTION_ARN=$(echo "${SIWE_STACK_OUTPUTS}" | python -c "import json,sys; outputs={x['OutputKey']: x['OutputValue'] for x in json.load(sys.stdin)}; print(outputs.get('AuthorizerFunctionArn', outputs.get('AutorizerFunctionArn','')))")

          if [ -z "${ARTIFACT_BUCKET}" ] || [ "${ARTIFACT_BUCKET}" = "None" ]; then
            echo "ArtifactBucket output was not found in ${TEAM_STACK_NAME}" >&2
            exit 1
          fi

          if [ -z "${STATUS_FUNCTION_ARN}" ] || [ "${STATUS_FUNCTION_ARN}" = "None" ]; then
            echo "StatusFunctionArn output was not found in ${TEAM_STACK_NAME}" >&2
            exit 1
          fi

          if [ -z "${HTTP_API_URL}" ] || [ "${HTTP_API_URL}" = "None" ]; then
            echo "HttpApiUrl output was not found in ${TEAM_STACK_NAME}" >&2
            exit 1
          fi

          if [ -z "${AUTHORIZER_FUNCTION_ARN}" ] || [ "${AUTHORIZER_FUNCTION_ARN}" = "None" ]; then
            echo "AuthorizerFunctionArn output was not found in ${SIWE_STACK_NAME}" >&2
            exit 1
          fi

          {
            echo "TEAM_ARTIFACT_BUCKET=${ARTIFACT_BUCKET}"
            echo "TEAM_STATUS_FUNCTION_ARN=${STATUS_FUNCTION_ARN}"
            echo "TEAM_HTTP_API_URL=${HTTP_API_URL}"
            echo "SIWE_AUTHORIZER_FUNCTION_ARN=${AUTHORIZER_FUNCTION_ARN}"
            echo "SAM_PARAMETER_OVERRIDES=ArtifactBucket=${ARTIFACT_BUCKET} StatusFunctionArn=${STATUS_FUNCTION_ARN} HttpApiUrl=${HTTP_API_URL} AuthorizerFunctionArn=${AUTHORIZER_FUNCTION_ARN}"
          } >> "$GITHUB_ENV"

      # sam deploy wraps `aws cloudformation deploy`, which sends
      # UsePreviousValue=true for every parameter NOT named in
      # --parameter-overrides. So on an existing stack a parameter left out of
      # that list keeps whatever value the stack was created with, and editing
      # its Default: in template.yaml changes nothing that is deployed.
      #
      # GeminiModel was in exactly that state: the template default was updated
      # to a current model, the deployed Lambdas kept serving the old model id,
      # and the repository looked correct while the running admin API did not.
      # It is now passed explicitly, read out of template.yaml so the template
      # stays the single source of truth rather than the value being duplicated
      # here and drifting (which is the failure this is fixing, one level up).
      - name: Resolve GeminiModel from the template default
        run: |
          GEMINI_MODEL="$(awk '/^  GeminiModel:/{f=1;next} f&&/^    Default:/{print $2;exit} f&&/^  [A-Za-z]/{exit}' template.yaml)"
          if [ -z "${GEMINI_MODEL}" ]; then
            echo "Could not read the GeminiModel default from template.yaml." >&2
            echo "If the Parameters block was reformatted, update this step -- do not" >&2
            echo "drop it, or the stack silently keeps its previous model id." >&2
            exit 1
          fi
          echo "GeminiModel resolved from template.yaml: ${GEMINI_MODEL}"
          echo "GEMINI_MODEL_PARAM=${GEMINI_MODEL}" >> "$GITHUB_ENV"

      - name: SAM deploy
        env:
          TEAM_TASK_JWT_TOKEN: ${{ secrets.TEAM_TASK_JWT_TOKEN }}
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "${STACK_NAME}" \
            --region "${REGION}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --parameter-overrides ${SAM_PARAMETER_OVERRIDES} GeminiModel="${GEMINI_MODEL_PARAM}" TeamTaskJwtToken="${TEAM_TASK_JWT_TOKEN}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      - name: Push RAG artifacts to S3
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          S3_PREFIX="s3://expertise-rag-artifacts-239571291755-prod/raw/${REPO_NAME}"
          find . -type f \( -name "*.md" -o -name "*.puml" \) -not -path "*/plantuml-libs/*" | while read -r file; do
            aws s3 cp "$file" "${S3_PREFIX}/${file#./}" --region "${REGION}"
          done
