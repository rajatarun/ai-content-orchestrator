name: Deploy SAM Application

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  REGION: ${{ vars.REGION || 'us-east-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || 'tarun-admin-content' }}
  TEAM_STACK_NAME: ${{ vars.TEAM_STACK_NAME || 'tarun-content-team' }}
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::239571291755:role/teamweave-github-actions-sam-deployer
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.REGION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: SAM build
        run: sam build --template-file template.yaml

      - name: SAM validate
        run: sam validate --template-file .aws-sam/build/template.yaml --lint

      - name: Load shared stack outputs
        run: |
          CONFIG_BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${TEAM_STACK_NAME}" \
            --region "${REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='ConfigBucket'].OutputValue" \
            --output text)
          STATUS_FUNCTION_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${TEAM_STACK_NAME}" \
            --region "${REGION}" \
            --query "Stacks[0].Outputs[?OutputKey=='StatusFunctionArn'].OutputValue" \
            --output text)

          if [ -z "${CONFIG_BUCKET}" ] || [ "${CONFIG_BUCKET}" = "None" ]; then
            echo "ConfigBucket output was not found in ${TEAM_STACK_NAME}" >&2
            exit 1
          fi

          if [ -z "${STATUS_FUNCTION_ARN}" ] || [ "${STATUS_FUNCTION_ARN}" = "None" ]; then
            echo "StatusFunctionArn output was not found in ${TEAM_STACK_NAME}" >&2
            exit 1
          fi

          {
            echo "TEAM_CONFIG_BUCKET=${CONFIG_BUCKET}"
            echo "TEAM_STATUS_FUNCTION_ARN=${STATUS_FUNCTION_ARN}"
          } >> "$GITHUB_ENV"

      - name: SAM deploy
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name "${STACK_NAME}" \
            --region "${REGION}" \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --resolve-s3 \
            --parameter-overrides \
              TeamConfigBucket="${TEAM_CONFIG_BUCKET}" \
              TeamStatusFunctionArn="${TEAM_STATUS_FUNCTION_ARN}" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
