repo: ai-content-orchestrator
description: AWS serverless application automating a weekly content publishing pipeline with AI-powered draft generation, newsletter delivery, and article lifecycle management.

tech_stack:
  runtime: python3.11
  iac: aws-sam
  aws_services:
    - lambda
    - dynamodb
    - s3
    - ses
    - sns
    - eventbridge
    - api-gateway
    - secrets-manager
  external_apis:
    - google-gemini
    - teamweave-http-api
  cicd: github-actions-oidc

design_patterns:

  - name: Serverless / Lambda Handler
    category: architectural
    files:
      - src/admin_api.py
      - src/public_api.py
      - src/site_data.py
      - src/appointment_api.py
      - src/automation.py
      - src/newsletter.py
    description: Six Lambda functions with standardized (event, context) handler signatures serve as the core compute units. API Gateway routes HTTP requests; EventBridge triggers scheduled handlers.

  - name: Repository Pattern
    category: data-access
    files:
      - src/db.py
    description: All DynamoDB operations are centralized in db.py, exposing a clean API (put_article, get_article, list_by_status, add_event, put_subscriber, etc.) that hides persistence details from handlers.

  - name: State Machine
    category: behavioral
    files:
      - src/statuses.py
      - src/admin_api.py
    description: Article lifecycle (DRAFT → AWAITING_APPROVAL → APPROVED → PUBLISHED) is modelled as an explicit state machine. _decorate_article_with_actions() maps the current state to valid next actions and enforces transition guards.

  - name: Strategy Pattern (with Fallback)
    category: behavioral
    files:
      - src/automation.py
    description: Draft generation tries the TeamWeave external service first (primary strategy). On failure it automatically falls back to direct Gemini BAU generation (secondary strategy), providing transparent resilience.

  - name: Adapter Pattern
    category: structural
    files:
      - src/admin_api.py
      - src/site_data.py
      - src/public_api.py
    description: _qs() and path extraction helpers normalise events from both REST API v1 and HTTP API v2 formats into a uniform internal representation, decoupling handlers from API Gateway version specifics.

  - name: Decorator Pattern
    category: structural
    files:
      - src/admin_api.py
      - src/logger.py
    description: _decorate_article_with_actions() enriches article dicts with derived CTA data without mutating the original. ExtraFieldsFormatter decorates log records with extra JSON context fields.

  - name: Pub/Sub (SNS)
    category: messaging
    files:
      - src/automation.py
      - template.yaml
    description: An SNS topic (ApprovalNotificationTopic) decouples approval-state transitions from email notification delivery, allowing additional subscribers to be added without changing producer code.

  - name: Event-Driven Architecture
    category: architectural
    files:
      - template.yaml
      - src/automation.py
      - src/newsletter.py
    description: EventBridge cron rules fire GenerateDraftsFunction (Monday 15:15 UTC) and NewsletterFunction (Monday 00:00 UTC) asynchronously, removing temporal coupling from API call paths.

  - name: Builder Pattern
    category: creational
    files:
      - src/automation.py
      - src/mailer.py
    description: _build_bau_prompt() constructs complex nested JSON prompt payloads step-by-step. MIMEMultipart in mailer.py assembles MIME email messages with headers and body parts incrementally.

  - name: Polling with Exponential Backoff
    category: resilience
    files:
      - src/automation.py
    description: pollExecution() polls the TeamWeave step-function execution until a terminal state is reached, using an increasing interval (up to 5 s) bounded by MAX_POLL_SECONDS to avoid thundering-herd retries.

  - name: Asynchronous Fire-and-Forget
    category: concurrency
    files:
      - src/admin_api.py
    description: Draft generation is triggered via Lambda InvocationType="Event" (async), returning an immediate API response while the generation runs independently in the background.

  - name: Parallel Execution (ThreadPoolExecutor)
    category: concurrency
    files:
      - src/site_data.py
    description: Blog-card data is fetched from S3 concurrently using ThreadPoolExecutor, with configurable parallelism (default 5, max 10), reducing list-endpoint latency proportionally.

  - name: Audit Log / Event Sourcing
    category: data
    files:
      - src/db.py
      - src/admin_api.py
    description: add_event() appends immutable EVENT#{articleId} records with ISO-timestamp sort keys for every significant state change (CREATED, GENERATED, PUBLISHED_TO_S3, GENERATE_FAILED), providing a full audit trail.

  - name: Secrets Manager Pattern
    category: security
    files:
      - src/aws_secrets.py
      - src/gemini_client.py
    description: Credentials (Gemini API key, JWT signing secret) are retrieved at runtime from AWS Secrets Manager rather than environment variables, keeping sensitive values out of Lambda configuration.

  - name: Environment-Based Configuration
    category: configuration
    files:
      - template.yaml
      - src/admin_api.py
      - src/automation.py
      - src/newsletter.py
    description: All tuneable values (TABLE_NAME, GEMINI_MODEL, ARTICLES_BUCKET, SES_FROM_EMAIL, ALLOWED_ORIGIN, MAX_POLL_SECONDS) are injected as Lambda environment variables via SAM parameter overrides, enabling per-environment configuration without code changes.

  - name: API Gateway Facade
    category: structural
    files:
      - template.yaml
    description: A single API Gateway instance with API-key authentication, Lambda authorizer (SIWE), usage throttling, and request logging acts as a unified facade in front of multiple independent Lambda functions.

  - name: Thin Controller
    category: architectural
    files:
      - src/admin_api.py
      - src/public_api.py
      - src/site_data.py
      - src/appointment_api.py
    description: Lambda handlers focus on request parsing, input validation, and response formatting. Domain logic is delegated to service modules (db.py, gemini_client.py, mailer.py, publisher.py), keeping controllers thin.

  - name: Pagination (Token-Based)
    category: data-access
    files:
      - src/site_data.py
      - src/automation.py
    description: S3 object listings use AWS paginators and ContinuationToken-based iteration to handle collections that exceed a single API response page, ensuring all objects are processed regardless of scale.

  - name: Null Object / Safe Default
    category: behavioral
    files:
      - src/admin_api.py
      - src/public_api.py
      - src/automation.py
    description: Handlers return empty dicts {} instead of None for missing bodies/parameters, and use `or {}` guards throughout, eliminating null-check boilerplate in downstream code.

  - name: Singleton Logger
    category: creational
    files:
      - src/logger.py
    description: get_logger() checks logger.handlers before adding a new handler, ensuring the logger is initialised only once per Lambda container lifetime regardless of how many modules import it.

  - name: SigV4 Request Signing
    category: security
    files:
      - src/automation.py
    description: Outbound HTTP requests to internal AWS-hosted APIs are signed with AWS Signature Version 4 via boto3's SigV4Auth, ensuring requests are authenticated without embedding long-lived credentials.

  - name: JWT Token Signing
    category: security
    files:
      - src/automation.py
    description: Short-lived HS256 JWT tokens are created in _create_jwt() using a secret from Secrets Manager to authorize TeamWeave task API calls, avoiding static API keys.

  - name: JSON Serialization Adapter
    category: data
    files:
      - src/admin_api.py
      - src/publisher.py
    description: _json_safe() recursively converts DynamoDB Decimal values to int/float before JSON serialisation, adapting the DynamoDB type system to the JSON type system without polluting the repository layer.

  - name: Graceful Degradation
    category: resilience
    files:
      - src/public_api.py
    description: Non-critical side-effects (e.g. SES contact-list registration) are wrapped in try/except with a pass fallback, so a failure in an optional integration never blocks the primary subscription flow.
